[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-research-agent"
version = "1.0.0"
description = "Agente de pesquisa profunda em tecnologia, SaaS e open source"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.25.0",
    "tiktoken>=0.5.0",
    "tenacity>=8.2.0",
    "redis>=5.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jmespath>=1.0",
    "anthropic>=0.25",
    "openai>=1.30",
    "google-genai>=1.0",
    "firecrawl-py>=4.30.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "slowapi>=0.1.9",
    "mcp>=1.0",
    "chromadb>=0.5.0",
    "kuzu>=0.11.0",
    "watchdog>=4.0",
    "structlog>=24.1.0",
    "sentence-transformers",
    "pyarrow",
    "streamlit",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "pytest-mock>=3.12",
]
export = [
    "reportlab>=4.0",      # Exportação PDF
    "python-docx>=1.1",    # Exportação DOCX
    "python-pptx>=0.6.23", # Exportação PPTX
]
scheduler = [
    "apscheduler>=3.10.0", # Agendamento de pesquisas recorrentes
]
sentiment = [
    "vaderSentiment>=3.3.2", # Análise de sentimentos e viés
]
tracing = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
]
all = [
    "reportlab>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "apscheduler>=3.10.0",
    "vaderSentiment>=3.3.2",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "pytest-mock>=3.12",
    "sentence-transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb",
    "ignore::DeprecationWarning:pyarrow",
    "ignore::UserWarning:sentence_transformers",
    "ignore::FutureWarning:torch",
]
markers = [
    "benchmark: benchmarks de performance em alto volume (ex: deduplicação com 20+ fontes)",
    "heavy: testes que requerem chromadb/pyarrow/sentence_transformers/kuzu — pulados automaticamente quando não disponíveis",
]

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [
    { root = "." }
]

[tool.ruff.lint]
ignore = [
    "E402",
    "E741",
    "F401",
    "F841"
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = [
    "assignment",
    "attr-defined",
    "arg-type",
    "return-value",
    "dict-item",
    "union-attr",
    "index",
    "var-annotated",
    "misc",
    "annotation-unchecked"
]
