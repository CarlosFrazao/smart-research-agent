[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "smart-research-agent"
version = "1.0.0"
description = "Agente de pesquisa profunda em tecnologia, SaaS e open source"
requires-python = ">=3.11"
license = {text = "MIT"}
dependencies = [
    "aiohttp>=3.9",
    "httpx>=0.25.0",
    "tiktoken>=0.5.0",
    "tenacity>=8.2.0",
    "redis>=5.0.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "jmespath>=1.0",
    "anthropic>=0.25",
    "openai>=1.30",
    "google-genai>=1.0",
    "firecrawl-py>=4.30.3",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "slowapi>=0.1.9",
    "mcp>=1.0,<2.0",
    "prometheus-client>=0.20",  # Métricas expostas em :8001/metrics (Bloco 13 / E8-T1)
    "chromadb>=0.5.0",
    "kuzu>=0.11.0",
    "watchdog>=4.0",
    "structlog>=24.1.0",
    "concurrent-log-handler>=0.9.25",  # Rotação de log tolerante a Windows (WinError 32)
    "sentence-transformers",
    "pyarrow",
    # Pinned to avoid streamlit>=1.59 importing the removed starlette symbol
    # DEFAULT_EXCLUDED_CONTENT_TYPES (ImportError on startup). 1.45.0 is the last
    # known-good line that no longer references that symbol; starlette 0.40.x still
    # ships it and is required by fastapi 0.115 in the shared venv.
    "streamlit>=1.45.0,<1.59.0",
    # starlette 0.40.0 still exposes DEFAULT_EXCLUDED_CONTENT_TYPES and is the floor
    # accepted by fastapi 0.115 (>=0.37,<0.43). Keep <0.42.0 to avoid the removal.
    "starlette>=0.40.0,<0.42.0",
    "sse-starlette<3.0.0",
    "brotli",
    "curl-cffi",
    # Providers de LLM/busca usados pelos searchers (faltavam na imagem:
    # groq fora da cadeia de LLM e serpapi/GH code search sem decode brotli)
    "groq>=0.20.0",
    "google-search-results>=2.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "aioresponses>=0.7",
    "pytest-mock>=3.12",
]
export = [
    "reportlab>=4.0",      # Exportação PDF
    "python-docx>=1.1",    # Exportação DOCX
    "python-pptx>=0.6.23", # Exportação PPTX
]
scheduler = [
    "apscheduler>=3.10.0", # Agendamento de pesquisas recorrentes
]
sentiment = [
    "vaderSentiment>=3.3.2", # Análise de sentimentos e viés
]
tracing = [
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
]
all = [
    "reportlab>=4.0",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "apscheduler>=3.10.0",
    "vaderSentiment>=3.3.2",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "opentelemetry-exporter-otlp>=1.24.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "aioresponses>=0.7",
    "pytest-mock>=3.12",
    "sentence-transformers",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*", "api*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--cov=src --cov-report=xml --cov-report=term-missing"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb",
    "ignore::DeprecationWarning:pyarrow",
    "ignore::UserWarning:sentence_transformers",
    "ignore::FutureWarning:torch",
]
markers = [
    "benchmark: benchmarks de performance em alto volume (ex: deduplicação com 20+ fontes)",
    "heavy: testes que requerem chromadb/pyarrow/sentence_transformers/kuzu — pulados automaticamente quando não disponíveis",
]

[tool.pyright]
extraPaths = ["."]
executionEnvironments = [
    { root = "." }
]

[tool.ruff.lint]
ignore = [
    "E402",
    "E741",
    "F401",
    "F841"
]

[tool.mypy]
ignore_missing_imports = true
disable_error_code = [
    "assignment",
    "attr-defined",
    "arg-type",
    "return-value",
    "dict-item",
    "union-attr",
    "index",
    "var-annotated",
    "misc",
    "annotation-unchecked"
]
