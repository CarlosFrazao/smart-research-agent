# CONFIGURAÇÃO RUNTIME DE PESOS DO HYBRIDRANKER (Bloco 2 / E2-T1 — SRA v7.0)
#
# ATENÇÃO: a seção `weights:` ABAIXO É LIDA EM RUNTIME por
# `src/config_loader.load_scoring_weights()` e aplicada em
# `HybridRankerConfig._apply_yaml_weights()`. Alterar esses valores em runtime
# reflete no log do ranker ("pesos aplicados de scoring_weights.yaml") sem
# precisar editar Python.
#
# A soma de bm25 + embedding + heuristic + llm deve ser 1.0. Se desviar mais de
# 0.01, o HybridRanker normaliza automaticamente (com warning). Para voltar ao
# default hardcoded, remova a chave ou todo o arquivo.
#
# Observação de design (2026-07-09):
#   A seção `sources_weights_by_type` AO FINAL deste arquivo é DOCUMENTAÇÃO de
#   capacidades por
#   TIPO DE FONTE (github/stars, reddit/upvotes, ...) e NÃO é carregada — o
#   HybridRanker combina sinais globais BM25 + embeddings + heurísticas + LLM,
#   estruturas não diretamente mapeáveis. Mantida como referência.
weights:
  bm25: 0.30
  embedding: 0.30
  heuristic: 0.25
  llm: 0.15



sources_weights_by_type:
  github:
    stars: 0.30
    forks: 0.20
    recency: 0.20
    releases: 0.15
    license: 0.10
    documentation: 0.05
  reddit:
    upvotes: 0.40
    comments: 0.30
    recency: 0.20
    subreddit_relevance: 0.10
  hackernews:
    points: 0.45
    comments: 0.25
    recency: 0.20
    author_reputation: 0.10
  firecrawl:
    content_quality: 0.35
    freshness: 0.25
    authority: 0.25
    relevance: 0.15
  awesome:
    list_stars: 0.40
    position_in_list: 0.30
    recency: 0.30
  producthunt:
    votes: 0.40
    comments: 0.30
    recency: 0.30
  arxiv:
    citations: 0.50
    recency: 0.30
    relevance: 0.20
