# AVISO: Este arquivo é documentação de referência de design, NÃO é carregado por nenhum código.
# Os searchers e seus timeouts/max_results são instanciados pela SearcherFactory
# (src/search/factory.py) com valores hardcoded/derivados de config.py, não a partir daqui.
# Para alterar comportamento real de uma fonte, edite: src/search/factory.py e src/config.py.
# Issue de rastreamento: conectar este YAML ao código é tarefa futura planejada
# (ver MISSAO_PARTE2_FASE2_CONFIG_E_HITL.md — Tarefa 2.1, Opção B).
#
# Observação de design (2026-07-09):
#   Mantido como documentação de capacidades de cada fonte. NÃO remova sem migrar os valores
#   para a SearcherFactory, sob risco de quem editar aqui achar que muda o comportamento.

sources:
  github:
    enabled: true
    timeout: 30
    max_results: 20
    base_url: https://api.github.com/search/repositories
  reddit:
    enabled: true
    timeout: 20
    max_results: 20
    base_url: https://www.reddit.com/search.json
  hackernews:
    enabled: true
    timeout: 20
    max_results: 20
    base_url: https://hn.algolia.com/api/v1/search
  arxiv:
    enabled: true
    timeout: 30
    max_results: 10
    base_url: http://export.arxiv.org/api/query
  producthunt:
    enabled: true
    timeout: 20
    max_results: 10
    base_url: https://api.producthunt.com/v2/api/graphql
  awesome:
    enabled: true
    timeout: 30
    max_results: 30
  firecrawl:
    enabled: true
    timeout: 45
    max_results: 10
  web:
    enabled: true
    timeout: 45
    max_results: 10
  semantic_scholar:
    enabled: true
    timeout: 30
    max_results: 10
    base_url: https://api.semanticscholar.org/graph/v1/paper/search
  pubmed:
    enabled: true
    timeout: 30
    max_results: 10
    base_url: https://eutils.ncbi.nlm.nih.gov/entrez/eutils/
  youtube:
    enabled: true
    timeout: 20
    max_results: 5
    base_url: https://www.googleapis.com/youtube/v3/
