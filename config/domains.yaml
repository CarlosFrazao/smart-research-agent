      - google_news_rss
      - newsapi_org
    secondary:
      - bluesky
      - mastodon_social
      - reddit
      - hackernews
    notes: "Fonte de notícias em tempo real (Fase 2 — Plano Parte 4). Desabilita fontes técnicas/acadêmicas."
  open_web:
    description: "Alias de 'universal' para compatibilidade com roteamento legado"
    primary:
      - searxng
      - web
    secondary:
      - multilingual
      - scraping
