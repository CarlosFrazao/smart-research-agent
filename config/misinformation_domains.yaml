# misinformation_domains.yaml — Lista de domínios de baixa confiabilidade para detecção de desinformação.
#
# Estrutura consumida por src/misinformation_detector.py:
#   - domain:  domínio (ou subdomínio) a ser sinalizado.
#   - reason:  motivo documentado da baixa confiabilidade.
#   - penalty: multiplicador aplicado ao score final do resultado (0.0 a 1.0; menor = mais penalizado).
#   - severity: classificação qualitativa (critical | high | medium | low) para telemetria/alertas.
#
# Fonte: compilação de listas públicas de fact-checkers reconhecidos
#   (NewsGuard ratings, Media Bias/Fact Check / MBFC, e relatórios de
#   desinformação documentados). Critério de inclusão: publicação documentada
#   e reiterada de informação factualmente falsa por fact-checkers reconhecidos
#   — não mera "controvérsia".
# Última atualização: 2026-07-09
# Para adicionar um domínio: validar em NewsGuard ou MBFC antes de incluir.

misinformation_domains:
