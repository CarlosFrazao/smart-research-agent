version: '3.8'

services:
  smart-research-agent:
    build: .
    env_file: .env
    environment:
      - FIRECRAWL_BASE_URL=http://firecrawl-api-new:3002
      - CHROMADB_HOST=chromadb
      - CHROMADB_PORT=8000
      - SEARXNG_URL=http://firecrawl-searxng:8080
    ports:
      - "3458:3458"
    volumes:
      - ./reports:/app/reports
      - ./.cache:/app/.cache
      - ./kuzu_data:/app/kuzu_data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./prompts:/app/prompts
      - ./hooks:/app/hooks
      - ./static:/app/static
      - ./test_sources.py:/app/test_sources.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - firecrawl_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3458/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  chromadb:
    image: chromadb/chroma:latest
    container_name: sra-chromadb
    ports:
      - "3024:8000"
    volumes:
      - ./chroma_data:/chroma/data
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/data
    networks:
      - default
      - firecrawl_net
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  firecrawl:
    image: ghcr.io/firecrawl/firecrawl:latest
    ports:
      - "3002:3002"
    environment:
      - FIRECRAWL_API_KEY=${FIRECRAWL_API_KEY}
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
    profiles:
      - with-firecrawl

  neo4j:
    image: neo4j:5.18-community
    container_name: sra-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/password123
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - default

  redis:
    image: redis:7.2-alpine
    container_name: sra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - default

networks:
  firecrawl_net:
    external: true
    name: firecrawl_backend

volumes:
  neo4j_data:
  neo4j_logs:
  redis_data:
