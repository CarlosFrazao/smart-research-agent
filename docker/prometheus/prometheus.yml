# ═══════════════════════════════════════════════════════════════════════════
# Smart Research Agent (SRA) — Prometheus scrape config
# Bloco 13 / E8-T1 — Grafana Dashboard de Qualidade
#
# Faz scrape das métricas expostas pelo SRA em :8001/metrics
# (src/observability/metrics.py → start_metrics_server). O serviço SRA no
# docker-compose é nomeado "smart-research-agent"; como Prometheus roda na
# mesma rede do compose, usa o nome do serviço como hostname.
# ═══════════════════════════════════════════════════════════════════════════

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "sra-metrics"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "smart-research-agent:8001"
        labels:
          service: "smart-research-agent"
          tier: "application"
