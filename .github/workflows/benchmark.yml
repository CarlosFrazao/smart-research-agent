name: Benchmark SRA vs Perplexity/Gemini

on:
  schedule:
    # Domingo 03:00 UTC — executa o benchmark semanalmente (Bloco 15 / E1-T3).
    - cron: "0 3 * * 0"
  workflow_dispatch: {}

jobs:
  benchmark-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,all]

      - name: Run benchmark (dry-run, fixtures — sem rede)
        run: |
          python -m tests.benchmark.benchmark_suite --dry-run

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: benchmark_results/report_*.md
          if-no-files-found: warn

  benchmark-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,all]

      - name: Run benchmark suite tests
        run: |
          python -m pytest tests/test_benchmark_suite.py -v --no-cov
